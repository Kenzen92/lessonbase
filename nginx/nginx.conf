user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Recover the real client IP from the PROXY protocol header that the
    # stream{} SNI demux (bottom of this file) prepends when it forwards TLS to
    # these vhosts on the loopback. Without this, rate-limiting / logging /
    # X-Forwarded-For would all see 127.0.0.1.
    set_real_ip_from 127.0.0.1;
    real_ip_header proxy_protocol;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    # Performance
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    # App-level per-file limit is 100M; allow headroom for the multipart envelope.
    client_max_body_size 110M;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript
               application/json application/javascript application/xml+rss
               application/atom+xml image/svg+xml;

    # Security headers (applied globally)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=general_limit:10m rate=30r/s;

    # Include server blocks owned by this stack
    include /etc/nginx/conf.d/*.conf;

    # Include server blocks for unrelated apps sharing this host (e.g.
    # other services proxied by this nginx). Empty by default; populated
    # via the NGINX_EXTRAS_DIR bind mount in docker-compose.vps.yml.
    include /etc/nginx/external.d/*.conf;
}

# ---------------------------------------------------------------------------
# TCP/SNI demultiplexer on :443 — shares the port between the websites and a
# self-hosted Xray REALITY VPN (container `xray`, defined in a separate compose
# stack on the shared `lessonbase_app_network`).
#
# nginx peeks the TLS SNI without terminating it (ssl_preread) and forwards the
# raw TLS, wrapped in the PROXY protocol so real client IPs survive:
#
#   SNI = www.microsoft.com   ->  xray:8443       (VLESS + REALITY VPN)
#   anything else             ->  127.0.0.1:8443  (the HTTPS vhosts above)
#
# Consequently the HTTPS server blocks in conf.d/ (and any external.d/ vhost)
# listen on 127.0.0.1:8443 with `proxy_protocol`, not :443 directly.
# Using a variable in proxy_pass + a resolver defers DNS to request time, so a
# stopped/absent `xray` container only breaks the VPN, never the websites.
# ---------------------------------------------------------------------------
stream {
    resolver 127.0.0.11 valid=10s ipv6=off;

    map $ssl_preread_server_name $vpn_upstream {
        www.microsoft.com   xray:8443;
        default             127.0.0.1:8443;
    }

    log_format vpn_sni '$remote_addr [$time_local] sni="$ssl_preread_server_name" -> $vpn_upstream';
    access_log /var/log/nginx/stream-access.log vpn_sni;

    server {
        listen 443 reuseport;
        listen [::]:443 reuseport;
        ssl_preread on;
        proxy_protocol on;
        proxy_pass $vpn_upstream;
        proxy_connect_timeout 5s;
        proxy_timeout 300s;
    }
}
