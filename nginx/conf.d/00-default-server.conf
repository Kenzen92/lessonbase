# Catches requests with an unknown Host header on this server and rejects
# them with 444 instead of falling through to whichever vhost happens to
# be defined first (which would otherwise leak the Django backend on
# requests for hostnames we don't own).
#
# File is prefixed with 00- so it loads before other conf.d files; this
# is cosmetic because default_server is matched explicitly by nginx.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

server {
    listen 127.0.0.1:8443 ssl proxy_protocol default_server;
    listen [::1]:8443 ssl proxy_protocol default_server;
    http2 on;
    server_name _;

    # A cert is required to terminate TLS. Reusing the lessonbase cert is
    # fine here — clients hitting an unknown host see a cert mismatch and
    # we close the connection with 444 before serving any content.
    ssl_certificate /etc/letsencrypt/live/teach.jkenny.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/teach.jkenny.tech/privkey.pem;

    return 444;
}
